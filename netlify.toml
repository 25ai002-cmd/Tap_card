# Netlify Configuration File
[build]
  command = "npm run build"
  publish = "dist"

# Redirect API calls to Render backend if deployed separately
# Replace https://your-tapcard-backend.onrender.com with your actual Render service URL
[[redirects]]
  from = "/api/*"
  to = "https://tapcard-platform.onrender.com/api/:splat"
  status = 200
  force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
